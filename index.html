<style>
:root{
  --bg:#0f1115; --bg-elev:#161922; --bg-card:#1b1f2a; --border:#2a2f3d;
  --text:#e8eaf0; --text-dim:#9aa1b2; --text-faint:#6b7280;
  --accent:#4f8cff; --accent-dim:#2d4a8a;
  --green:#3ecf8e; --amber:#f0a83d; --red:#f0555f;
  --radius:10px; --shadow:0 4px 20px rgba(0,0,0,.35);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f6f9; --bg-elev:#ffffff; --bg-card:#ffffff; --border:#e2e5ec;
    --text:#1a1d27; --text-dim:#5a6072; --text-faint:#8890a0;
    --accent:#2f6fed; --accent-dim:#dce7ff;
    --shadow:0 4px 20px rgba(20,20,40,.08);
  }
}
:root[data-theme="light"]{
  --bg:#f5f6f9; --bg-elev:#ffffff; --bg-card:#ffffff; --border:#e2e5ec;
  --text:#1a1d27; --text-dim:#5a6072; --text-faint:#8890a0;
  --accent:#2f6fed; --accent-dim:#dce7ff;
  --shadow:0 4px 20px rgba(20,20,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0f1115; --bg-elev:#161922; --bg-card:#1b1f2a; --border:#2a2f3d;
  --text:#e8eaf0; --text-dim:#9aa1b2; --text-faint:#6b7280;
  --accent:#4f8cff; --accent-dim:#2d4a8a;
  --shadow:0 4px 20px rgba(0,0,0,.35);
}
*, *::before, *::after{ transition: background-color .15s ease, border-color .15s ease, color .15s ease; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  line-height:1.55; min-height:100vh;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
a{color:var(--accent);}
::selection{background:var(--accent-dim);}

.dua-banner{
  position:relative; overflow:hidden;
  background:linear-gradient(120deg, #1b3a63, #2d1f52 55%, #3a1f4a);
  padding:14px 20px 16px;
  text-align:center;
}
.dua-banner::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 15% 30%, rgba(255,255,255,.07), transparent 40%),
    radial-gradient(circle at 85% 70%, rgba(255,255,255,.06), transparent 40%);
  pointer-events:none;
}
.dua-inner{
  position:relative; max-width:900px; margin:0 auto;
  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
}
.dua-deco{ color:#e0c876; font-size:.9rem; opacity:.85; flex-shrink:0; }
.dua-text{
  font-family:'Amiri', 'Traditional Arabic', serif;
  direction:rtl; unicode-bidi:isolate;
  font-size:clamp(1.15rem, 2.6vw, 1.55rem); font-weight:700;
  color:#f5edd8; line-height:1.6; letter-spacing:0;
  text-shadow:0 1px 12px rgba(224,200,118,.25);
}
.dua-fr{
  display:block; font-family:var(--font); direction:ltr;
  font-size:.72rem; font-weight:400; color:#c9c2e0; opacity:.75; margin-top:3px; letter-spacing:.02em;
}
:root[data-theme="light"] .dua-banner{ background:linear-gradient(120deg, #eef2ff, #f5eaff 55%, #fdf2f8); }
:root[data-theme="light"] .dua-text{ color:#3a2a55; text-shadow:none; }
:root[data-theme="light"] .dua-fr{ color:#6a5f8a; }
:root[data-theme="light"] .dua-deco{ color:#b8923f; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .dua-banner{ background:linear-gradient(120deg, #eef2ff, #f5eaff 55%, #fdf2f8); }
  :root:not([data-theme="dark"]) .dua-text{ color:#3a2a55; text-shadow:none; }
  :root:not([data-theme="dark"]) .dua-fr{ color:#6a5f8a; }
  :root:not([data-theme="dark"]) .dua-deco{ color:#b8923f; }
}

/* ---------- Header ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding:14px 20px;
}
.header-inner{max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.1rem; white-space:nowrap; letter-spacing:-.01em;}
.brand-logo{width:32px; height:32px; border-radius:9px; flex-shrink:0; display:block; box-shadow:0 2px 8px rgba(79,140,255,.35);}
.brand-saad{color:var(--text);}
.brand-concours{background:linear-gradient(135deg,var(--accent),#8a5cf6); -webkit-background-clip:text; background-clip:text; color:transparent;}
.search-box{flex:1; min-width:200px; position:relative;}
.search-box input{
  width:100%; padding:9px 14px 9px 36px; border-radius:999px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:.92rem; outline:none;
}
.search-box input:focus{border-color:var(--accent);}
.search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; width:16px; height:16px;}
.stat-pill{
  font-size:.78rem; color:var(--text-dim); background:var(--bg); border:1px solid var(--border);
  padding:5px 11px; border-radius:999px; white-space:nowrap;
}
.theme-toggle{
  width:34px; height:34px; border-radius:999px; border:1px solid var(--border); background:var(--bg);
  color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; font-size:1rem;
}
.theme-toggle:hover{ border-color:var(--accent); color:var(--accent); }

/* ---------- Layout ---------- */
.layout{max-width:1400px; margin:0 auto; display:grid; grid-template-columns:260px 1fr; gap:22px; padding:22px 20px 60px;}

/* ---------- Filters sidebar ---------- */
.filters{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; align-self:start; position:sticky; top:78px; max-height:calc(100vh - 100px); overflow-y:auto;
}
@media (max-width: 900px){
  .layout{grid-template-columns:1fr;}
  .filters{position:static; max-height:none;}
}
.filters h3{margin:0 0 10px; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint);}
.filter-group{margin-bottom:18px;}
.filter-group select{
  width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:.88rem; outline:none;
}
.filter-group select:focus{border-color:var(--accent);}
.chip-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.chip{
  font-size:.74rem; padding:4px 10px; border-radius:999px; border:1px solid var(--border);
  background:var(--bg); color:var(--text-dim); cursor:pointer; transition:.15s;
}
.chip:hover{border-color:var(--accent); color:var(--text);}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.reset-btn{
  width:100%; margin-top:6px; padding:9px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--text-dim); cursor:pointer; font-size:.85rem;
}
.reset-btn:hover{border-color:var(--red); color:var(--red);}

/* ---------- Results grid ---------- */
.results-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.results-count{font-size:.85rem; color:var(--text-dim);}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
.card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px;
}
.card:hover{border-color:var(--accent); transform:translateY(-3px); box-shadow:0 10px 28px rgba(79,140,255,.18);}
.card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.card-title{font-weight:600; font-size:.98rem;}
.card-year{
  font-size:.72rem; font-weight:700; color:var(--accent); background:var(--accent-dim);
  padding:3px 9px; border-radius:999px; white-space:nowrap;
}
.card-meta{font-size:.82rem; color:var(--text-dim);}
.card-modules{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px;}
.mod-tag{font-size:.68rem; padding:2px 8px; border-radius:6px; background:var(--bg); border:1px solid var(--border); color:var(--text-faint);}
.card-bottom{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:6px;}
.diff-badge{font-size:.72rem; color:var(--text-faint);}
.img-badge{font-size:.72rem; color:var(--green); display:flex; align-items:center; gap:4px;}
.empty-state{padding:60px 20px; text-align:center; color:var(--text-faint);}

/* ---------- Modal ---------- */
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
  align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg-elev); border:1px solid var(--border); border-radius:14px; max-width:920px; width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5); animation:pop .15s ease;
}
@keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.modal-header{
  position:sticky; top:0; background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding:18px 22px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-radius:14px 14px 0 0;
}
.modal-header h2{margin:0 0 6px; font-size:1.2rem;}
.modal-header .sub{font-size:.85rem; color:var(--text-dim);}
.close-btn{
  background:var(--bg); border:1px solid var(--border); color:var(--text-dim); border-radius:8px;
  width:32px; height:32px; cursor:pointer; font-size:1.1rem; flex-shrink:0;
}
.close-btn:hover{color:var(--red); border-color:var(--red);}
.modal-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.dl-btn{
  display:flex; align-items:center; gap:6px; background:var(--accent); border:1px solid var(--accent);
  color:#fff; border-radius:8px; padding:0 14px; height:32px; cursor:pointer; font-size:.82rem; font-weight:600;
  white-space:nowrap;
}
.dl-btn:hover{ filter:brightness(1.08); }
.card-dl{
  background:var(--bg); border:1px solid var(--border); color:var(--text-dim); border-radius:7px;
  width:28px; height:28px; cursor:pointer; font-size:.85rem; flex-shrink:0; display:flex; align-items:center; justify-content:center;
}
.card-dl:hover{ color:var(--accent); border-color:var(--accent); }
.modal-body{padding:22px;}
.info-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.info-tag{font-size:.76rem; padding:4px 10px; border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--text-dim);}
.tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab-btn{
  padding:9px 16px; background:none; border:none; color:var(--text-faint); cursor:pointer;
  font-size:.88rem; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.enonce-content{font-size:.94rem;}
.enonce-content table{border-collapse:collapse; width:100%; margin:14px 0; font-size:.85rem;}
.enonce-content th,.enonce-content td{border:1px solid var(--border); padding:6px 10px; text-align:left;}
.enonce-content th{background:var(--bg); font-weight:600;}
.enonce-content pre{background:var(--bg); padding:12px; border-radius:8px; overflow-x:auto;}
.enonce-content code{background:var(--bg); padding:1px 5px; border-radius:4px; font-size:.88em;}
.enonce-content blockquote{border-left:3px solid var(--accent); margin:10px 0; padding:2px 14px; color:var(--text-dim);}
.image-gallery{display:flex; flex-direction:column; gap:14px;}
.image-gallery img{width:100%; border-radius:8px; border:1px solid var(--border); cursor:zoom-in;}
.no-images{color:var(--text-faint); font-size:.88rem; font-style:italic;}
.source-box{font-size:.85rem; color:var(--text-dim); word-break:break-all;}

/* Lightbox */
.lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; align-items:center; justify-content:center; padding:20px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:100%; max-height:100%; border-radius:6px;}

footer{text-align:center; padding:30px 20px; color:var(--text-faint); font-size:.8rem;}

/* ---------- View nav ---------- */
.view-nav{display:flex; gap:4px; background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px; flex-shrink:0;}
.view-nav-btn{border:none; background:none; color:var(--text-dim); padding:6px 14px; border-radius:999px; font-size:.85rem; cursor:pointer; white-space:nowrap;}
.view-nav-btn.active{background:var(--accent); color:#fff;}

/* ---------- Évaluation ---------- */
.eval-view{max-width:1000px; margin:0 auto; padding:28px 20px 70px;}
.eval-title{font-size:1.3rem; margin:0 0 6px;}
.eval-sub{color:var(--text-dim); font-size:.92rem; margin:0 0 18px;}
.eval-module-card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); cursor:pointer;
  transition:transform .15s ease, border-color .15s ease;
}
.eval-module-card:hover{border-color:var(--accent); transform:translateY(-2px);}
.eval-module-card.disabled{opacity:.5; cursor:not-allowed;}
.eval-module-card.disabled:hover{transform:none; border-color:var(--border);}
.eval-module-name{font-weight:700; font-size:1.05rem;}
.eval-module-desc{font-size:.85rem; color:var(--text-dim);}
.eval-module-meta{font-size:.76rem; color:var(--accent); font-weight:600;}
.eval-toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
.eval-toolbar .reset-btn{width:auto; margin:0; padding:8px 14px;}
.eval-chapter-chips{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
.eval-progress{font-size:.8rem; color:var(--text-dim); white-space:nowrap;}
.eval-q-card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:12px;
}
.eval-q-card.correct{border-color:var(--green);}
.eval-q-card.incorrect{border-color:var(--red);}
.eval-q-num{font-size:.72rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
.eval-q-text{font-weight:600; margin-bottom:4px; font-size:.96rem;}
.eval-hint{font-size:.74rem; color:var(--text-faint); font-style:italic; margin-bottom:8px;}
.eval-opt{
  display:flex; align-items:flex-start; gap:9px; padding:7px 9px; border-radius:8px; cursor:pointer;
  font-size:.9rem; border:1px solid transparent;
}
.eval-opt:hover{background:var(--bg);}
.eval-opt input{margin-top:3px; flex-shrink:0;}
.eval-opt.opt-correct{background:rgba(62,207,142,.12); border-color:var(--green);}
.eval-opt.opt-wrong{background:rgba(240,85,95,.12); border-color:var(--red);}
.eval-justif{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:.83rem; color:var(--text-dim);}
.eval-submit-bar{position:sticky; bottom:14px; display:flex; gap:10px; justify-content:center; padding-top:10px;}
.eval-score-banner{
  border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; text-align:center;
  background:var(--bg-elev); border:1px solid var(--accent);
}
.eval-score-num{font-size:2.1rem; font-weight:800; color:var(--accent);}
.eval-score-sub{color:var(--text-dim); font-size:.88rem; margin-top:4px;}
.eval-score-chapters{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:12px; font-size:.82rem; color:var(--text-dim);}
</style>
</head>
<body>

<div class="dua-banner">
  <div class="dua-inner">
    <span class="dua-deco">✦</span>
    <span>
      <span class="dua-text" id="duaText" dir="rtl" lang="ar"></span>
      <span class="dua-fr" id="duaFr"></span>
    </span>
    <span class="dua-deco">✦</span>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#8a5cf6"/>
        </linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#logoGrad)"/>
        <path d="M32 14 12 23l20 9 20-9-20-9Z" fill="white"/>
        <path d="M20 28v10c0 4 6 8 12 8s12-4 12-8V28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <span><span class="brand-saad">Saad</span><span class="brand-concours">Concours</span></span>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Rechercher (établissement, ville, mot-clé de l'énoncé...)">
    </div>
    <nav class="view-nav">
      <button class="view-nav-btn active" id="navConcours">📚 Concours</button>
      <button class="view-nav-btn" id="navEval">📝 Évaluation</button>
    </nav>
    <div class="stat-pill" id="statPill">— concours</div>
    <div class="stat-pill" id="visitorPill" title="Nombre de visites">👁 —</div>
    <button class="theme-toggle" id="themeToggle" title="Changer de thème" aria-label="Changer de thème">🌙</button>
  </div>
</header>

<div class="layout" id="viewConcours">
  <aside class="filters">
    <h3>Filtrer</h3>
    <div class="filter-group">
      <label style="font-size:.8rem;color:var(--text-dim);">Ville</label>
      <select id="filterVille"><option value="">Toutes les villes</option></select>
    </div>
    <div class="filter-group">
      <label style="font-size:.8rem;color:var(--text-dim);">Filière</label>
      <select id="filterFiliere"><option value="">Toutes les filières</option></select>
    </div>
    <div class="filter-group">
      <label style="font-size:.8rem;color:var(--text-dim);">Établissement</label>
      <select id="filterEtab"><option value="">Tous les établissements</option></select>
    </div>
    <div class="filter-group">
      <label style="font-size:.8rem;color:var(--text-dim);">Année</label>
      <select id="filterAnnee"><option value="">Toutes les années</option></select>
    </div>
    <div class="filter-group">
      <label style="font-size:.8rem;color:var(--text-dim);">Module requis</label>
      <div class="chip-list" id="moduleChips"></div>
    </div>
    <button class="reset-btn" id="resetBtn">✕ Réinitialiser les filtres</button>
  </aside>

  <main>
    <div class="results-header">
      <div class="results-count" id="resultsCount"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="eval-view" id="viewEval" style="display:none;">

  <div id="evalModuleList">

(function initTheme(){
  const saved = localStorage.getItem('theme');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const theme = saved || (prefersLight ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();

function applyThemeButton(){
  const theme = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
}

document.addEventListener('DOMContentLoaded', () => {
  applyThemeButton();
  document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);

let ALL = [];
let filtered = [];
let activeModule = "";
let currentModalConcours = null;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

fetch('data/concours.json')
  .then(r => r.json())
  .then(data => {
    ALL = data;
    initFilters();
    applyFilters();
  })
  .catch(err => {
    $('#grid').innerHTML = `<div class="empty-state">Erreur de chargement des données : ${err}</div>`;
  });

function uniq(arr){ return [...new Set(arr)].filter(Boolean).sort(); }

function initFilters(){
  const villes = uniq(ALL.map(c => c.ville));
  const filieres = uniq(ALL.map(c => c.filiere));
  const etabs = uniq(ALL.map(c => c.etablissement));
  const annees = uniq(ALL.map(c => c.annee)).sort((a,b)=> String(b).localeCompare(String(a)));
  const modules = uniq(ALL.flatMap(c => c.modules || []));

  fillSelect('#filterVille', villes);
  fillSelect('#filterFiliere', filieres);
  fillSelect('#filterEtab', etabs);
  fillSelect('#filterAnnee', annees);

  const chipWrap = $('#moduleChips');
  modules.forEach(m => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = m;
    chip.addEventListener('click', () => {
      activeModule = (activeModule === m) ? "" : m;
      $$('.chip').forEach(c => c.classList.toggle('active', c.textContent === activeModule));
      applyFilters();
    });
    chipWrap.appendChild(chip);
  });

  ['#filterVille','#filterFiliere','#filterEtab','#filterAnnee'].forEach(id => {
    $(id).addEventListener('change', applyFilters);
  });
  $('#searchInput').addEventListener('input', applyFilters);
  $('#resetBtn').addEventListener('click', () => {
    ['#filterVille','#filterFiliere','#filterEtab','#filterAnnee'].forEach(id => $(id).value = "");
    $('#searchInput').value = "";
    activeModule = "";
    $$('.chip').forEach(c => c.classList.remove('active'));
    applyFilters();
  });
}

function fillSelect(sel, values){
  const el = $(sel);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    el.appendChild(opt);
  });
}

function applyFilters(){
  const ville = $('#filterVille').value;
  const filiere = $('#filterFiliere').value;
  const etab = $('#filterEtab').value;
  const annee = $('#filterAnnee').value;
  const q = $('#searchInput').value.trim().toLowerCase();

  filtered = ALL.filter(c => {
    if (ville && c.ville !== ville) return false;
    if (filiere && c.filiere !== filiere) return false;
    if (etab && c.etablissement !== etab) return false;
    if (annee && String(c.annee) !== annee) return false;
    if (activeModule && !(c.modules||[]).includes(activeModule)) return false;
    if (q){
      const hay = [c.ville,c.etablissement,c.filiere,c.annee,c.notions_cles,c.enonce_md,(c.modules||[]).join(' ')]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  renderGrid();
}

function renderGrid(){
  $('#statPill').textContent = `${ALL.length} concours`;
  $('#resultsCount').textContent = `${filtered.length} résultat${filtered.length>1?'s':''}`;
  const grid = $('#grid');
  grid.innerHTML = '';
  if (filtered.length === 0){
    grid.innerHTML = `<div class="empty-state">Aucun concours ne correspond à ces filtres.</div>`;
    return;
  }
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const hasImg = (c.images||[]).length > 0;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">${escapeHtml(c.etablissement)}</div>
        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
          <div class="card-year">${escapeHtml(String(c.annee))}</div>
          <button class="card-dl" title="Télécharger l'énoncé (PDF)">⬇</button>
        </div>
      </div>
      <div class="card-meta">📍 ${escapeHtml(c.ville)} · ${escapeHtml(c.filiere)}</div>
      <div class="card-modules">${(c.modules||[]).slice(0,4).map(m=>`<span class="mod-tag">${escapeHtml(m)}</span>`).join('')}${(c.modules||[]).length>4?`<span class="mod-tag">+${c.modules.length-4}</span>`:''}</div>
      <div class="card-bottom">
        <span class="diff-badge">Difficulté : ${escapeHtml(c.difficulte||'?')}</span>
        ${hasImg ? '<span class="img-badge">🖼️ scan réel</span>' : ''}
      </div>
    `;
    card.addEventListener('click', () => openModal(c));
    card.querySelector('.card-dl').addEventListener('click', (e) => {
      e.stopPropagation();
      downloadEnonce(c);
    });
    grid.appendChild(card);
  });
}

function formatQCM(md){
  if (!md) return md;
  const lines = md.split('\n');
  const out = [];
  const order = 'abcde';

  for (let line of lines){
    const markerRe = /\b([A-Ea-e])[.:]\s+/g;
    const matches = [...line.matchAll(markerRe)];

    if (matches.length >= 3){
      const letters = matches.map(m => m[1].toLowerCase());
      let pos = -1, seqOk = letters[0] === 'a';
      for (const l of letters){
        const idx = order.indexOf(l);
        if (idx <= pos){ seqOk = false; break; }
        pos = idx;
      }
      if (seqOk){
        const stem = line.slice(0, matches[0].index).trim();
        if (stem) out.push(stem);
        for (let i = 0; i < matches.length; i++){
          const start = matches[i].index + matches[i][0].length;
          const end = (i + 1 < matches.length) ? matches[i + 1].index : line.length;
          let txt = line.slice(start, end).trim().replace(/[;.]\s*$/, '').trim();
          out.push(`- **${matches[i][1].toLowerCase()}.** ${txt}`);
        }
        continue;
      }
    }

    const singleM = line.match(/^\s*([A-Ea-e])[.:]\s+(.+)$/);
    if (singleM){
      out.push(`- **${singleM[1].toLowerCase()}.** ${singleM[2].trim()}`);
      continue;
    }

    out.push(line);
  }
  return out.join('\n');
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openModal(c){
  currentModalConcours = c;
  $('#modalTitle').textContent = `${c.etablissement} — ${c.annee}`;
  $('#modalSub').textContent = `${c.filiere} · ${c.ville}`;
  $('#modalInfoRow').innerHTML = `
    <span class="info-tag">📍 ${escapeHtml(c.ville)}</span>
    <span class="info-tag">🏫 ${escapeHtml(c.etablissement)}</span>
    <span class="info-tag">🎓 ${escapeHtml(c.filiere)}</span>
    <span class="info-tag">📅 ${escapeHtml(String(c.annee))}</span>
    <span class="info-tag">⭐ ${escapeHtml(c.difficulte||'?')}</span>
  `;

  const formattedEnonce = formatQCM(c.enonce_md);
  const enonceHtml = window.marked ? marked.parse(formattedEnonce || '*Énoncé non disponible.*') : (formattedEnonce||'');
  $('#enonceContent').innerHTML = enonceHtml;

  const gallery = $('#imageGallery');
  gallery.innerHTML = '';
  if ((c.images||[]).length){
    c.images.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(src));
      gallery.appendChild(img);
    });
  } else {
    gallery.innerHTML = '<div class="no-images">Image source non récupérable (lien d\'origine inaccessible).</div>';
  }

  $('#sourceContent').innerHTML = (window.marked ? marked.parse(c.source || '') : (c.source||''));

  // reset tabs
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'enonce'));
  $$('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-enonce'));

  $('#modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  if (window.renderMathInElement){
    renderMathInElement($('#enonceContent'), {
      delimiters: [
        {left:'$$', right:'$$', display:true},
        {left:'$', right:'$', display:false}
      ],
      throwOnError:false
    });
  }
}

function closeModal(){
  $('#modalOverlay').classList.remove('open');

function stripInlineMd(s){
  return s.replace(/\*\*/g, '').replace(/\$\$?/g, '').trim();
}

function downloadEnonce(c){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const marginX = 18;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const maxWidth = pageW - marginX * 2;
  const bottomLimit = pageH - 20;
  let y = 20;

  function ensureSpace(need){
    if (y + need > bottomLimit){ doc.addPage(); y = 20; }
  }

  function addWrappedLine(text, opts={}){
    const { bold=false, size=10.5, indent=0, gapAfter=1.6, color=[20,20,25] } = opts;
    doc.setFont(undefined, bold ? 'bold' : 'normal');
    doc.setFontSize(size);
    doc.setTextColor(...color);
    const clean = stripInlineMd(text);
    if (!clean){ y += 2; return; }
    const wrapped = doc.splitTextToSize(clean, maxWidth - indent);
    for (const wl of wrapped){
      ensureSpace(size * 0.42);
      doc.text(wl, marginX + indent, y);
      y += size * 0.42;
    }
    y += gapAfter;
  }

  // Bold-prefix line: e.g. "**Q1.** stem text" or "- **a.** choice text"
  function addPrefixedLine(prefix, rest, opts={}){
    const { indent=0, bullet=false, size=10.5, gapAfter=1.8 } = opts;
    doc.setFontSize(size);
    const bx = marginX + indent + (bullet ? 4 : 0);
    doc.setFont(undefined, 'bold');
    const prefixClean = stripInlineMd(prefix);
    const prefixW = doc.getTextWidth(prefixClean + ' ');
    const restClean = stripInlineMd(rest);
    const wrapped = doc.splitTextToSize(restClean, maxWidth - indent - prefixW - (bullet ? 4 : 0));
    ensureSpace(size * 0.42);
    if (bullet){ doc.setFont(undefined, 'normal'); doc.text('•', marginX + indent, y); }
    doc.setFont(undefined, 'bold');
    doc.text(prefixClean, bx, y);
    doc.setFont(undefined, 'normal');
    if (wrapped[0]) doc.text(wrapped[0], bx + prefixW, y);
    y += size * 0.42;
    for (let i = 1; i < wrapped.length; i++){
      ensureSpace(size * 0.42);
      doc.text(wrapped[i], bx, y);
      y += size * 0.42;
    }
    y += gapAfter;
  }

  function addTable(rows){
    const cleanRows = rows.map(r => r.map(cell => stripInlineMd(cell)));
    ensureSpace(20);
    doc.autoTable({
      startY: y,
      margin: { left: marginX, right: marginX },
      head: [cleanRows[0]],
      body: cleanRows.slice(1),
      styles: { fontSize: 8.5, cellPadding: 2, overflow: 'linebreak' },
      headStyles: { fillColor: [79, 140, 255], textColor: 255 },
      theme: 'grid'
    });
    y = doc.lastAutoTable.finalY + 4;
  }

  // ---- Header ----
  doc.setFont(undefined, 'bold'); doc.setFontSize(15); doc.setTextColor(20,20,25);
  doc.text(`${c.etablissement} — ${c.annee}`, marginX, y); y += 7;
  doc.setFont(undefined, 'normal'); doc.setFontSize(10.5); doc.setTextColor(90,90,100);
  doc.text(`${c.filiere} · ${c.ville}${c.difficulte ? ' · Difficulté : ' + c.difficulte : ''}`, marginX, y); y += 5;
  doc.setDrawColor(200,200,210); doc.line(marginX, y, pageW - marginX, y); y += 7;

  // ---- Body: line-by-line markdown-lite parser ----
  const src = (c.enonce_md || 'Énoncé non disponible.').split('\n');
  let i = 0;
  while (i < src.length){
    const line = src[i];

    if (/^\s*$/.test(line)){ y += 2.4; i++; continue; }

    if (/^\|/.test(line.trim())){
      const rows = [];
      while (i < src.length && /^\|/.test(src[i].trim())){
        const cells = src[i].trim().replace(/^\||\|$/g, '').split('|').map(s => s.trim());
        if (!/^:?-+:?$/.test(cells.join(''))) rows.push(cells);
        i++;
      }
      if (rows.length) addTable(rows);
      continue;
    }

    const headingM = line.match(/^(#{2,4})\s+(.*)$/);
    if (headingM){
      y += 2;
      addWrappedLine(headingM[2], { bold: true, size: 12, gapAfter: 2.5 });
      i++; continue;
    }

    const bulletM = line.match(/^\s*-\s+\*\*([^*]+)\*\*\s*(.*)$/);
    if (bulletM){
      addPrefixedLine(bulletM[1], bulletM[2], { indent: 4, bullet: true });
      i++; continue;
    }
    const bulletPlainM = line.match(/^\s*-\s+(.*)$/);
    if (bulletPlainM){
      addPrefixedLine('•', bulletPlainM[1], { indent: 4 });
      i++; continue;
    }

    const stemM = line.match(/^\*\*([^*]+)\*\*\s*(.*)$/);
    if (stemM){
      y += 1.5;
      addPrefixedLine(stemM[1], stemM[2], { size: 10.5, gapAfter: 2 });
      i++; continue;
    }

    addWrappedLine(line);
    i++;
  }

  // ---- Source ----
  y += 4; ensureSpace(14);
  doc.setDrawColor(200,200,210); doc.line(marginX, y, pageW - marginX, y); y += 6;
  addWrappedLine('Source', { bold: true, size: 10 });
  addWrappedLine(c.source || 'non précisée', { size: 9, color: [110,110,120] });

  doc.save(`${c.id}.pdf`);
}

/* ================= Évaluation (quiz) ================= */
function mdLiteInline(s){
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

let evalRegistry = [];
let evalCurrentQuiz = null;
let evalCurrentChapter = 'Tous';
let evalUserAnswers = {};
let evalSubmitted = false;

$('#navConcours').addEventListener('click', () => switchView('concours'));
$('#navEval').addEventListener('click', () => switchView('eval'));

function switchView(view){
  const isEval = view === 'eval';
  $('#viewConcours').style.display = isEval ? 'none' : 'grid';
  $('#viewEval').style.display = isEval ? 'block' : 'none';
  $('#navConcours').classList.toggle('active', !isEval);
  $('#navEval').classList.toggle('active', isEval);
  if (isEval && evalRegistry.length === 0) loadEvalRegistry();
}

function loadEvalRegistry(){
  fetch('data/quiz/registry.json')
    .then(r => r.json())
    .then(data => { evalRegistry = data; renderEvalModuleList(); })
    .catch(() => { $('#evalModuleGrid').innerHTML = `<div class="empty-state">Impossible de charger les modules d'évaluation.</div>`; });
}

function renderEvalModuleList(){
  $('#evalQuizWrap').style.display = 'none';
  $('#evalModuleList').style.display = 'block';
  const grid = $('#evalModuleGrid');
  grid.innerHTML = '';
  evalRegistry.forEach(m => {
    const card = document.createElement('div');
    card.className = 'eval-module-card' + (m.available ? '' : ' disabled');
    card.innerHTML = `
      <div class="eval-module-name">${escapeHtml(m.module)}</div>
      <div class="eval-module-desc">${escapeHtml(m.title)}</div>
      <div class="eval-module-meta">${m.available ? `${m.nb_questions} questions` : 'Bientôt disponible'}</div>
    `;
    if (m.available){
      card.addEventListener('click', () => loadEvalQuiz(m));
    }
    grid.appendChild(card);
  });
}

function loadEvalQuiz(meta){
  fetch(meta.file)
    .then(r => r.json())
    .then(data => {
      evalCurrentQuiz = data;
      evalCurrentChapter = 'Tous';
      evalUserAnswers = {};
      evalSubmitted = false;
      $('#evalModuleList').style.display = 'none';
      $('#evalQuizWrap').style.display = 'block';
      $('#evalQuizTitle').textContent = data.title;
      renderEvalChapterChips();
      renderEvalQuestions();
    });
}

function renderEvalChapterChips(){
  const wrap = $('#evalChapterChips');
  wrap.innerHTML = '';
  const chips = ['Tous', ...evalCurrentQuiz.chapters];
  chips.forEach(ch => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (ch === evalCurrentChapter ? ' active' : '');
    chip.textContent = ch === 'Tous' ? `Tous (${evalCurrentQuiz.questions.length})` : ch;
    chip.addEventListener('click', () => {
      evalCurrentChapter = ch;
      evalUserAnswers = {};
      evalSubmitted = false;
      renderEvalChapterChips();
      renderEvalQuestions();
    });
    wrap.appendChild(chip);
  });
}

function currentEvalQuestions(){
  if (evalCurrentChapter === 'Tous') return evalCurrentQuiz.questions;
  return evalCurrentQuiz.questions.filter(q => q.chapter === evalCurrentChapter);
}

function renderEvalQuestions(){
  const qs = currentEvalQuestions();
  $('#evalProgress').textContent = `${qs.length} question${qs.length>1?'s':''}`;
  $('#evalScoreBanner').innerHTML = '';
  $('#evalSubmitBtn').style.display = 'inline-flex';
  $('#evalRetryBtn').style.display = 'none';
  $('#evalPdfBtn').style.display = 'none';
  const wrap = $('#evalQuestions');
  wrap.innerHTML = '';
  qs.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'eval-q-card';
    card.dataset.qid = q.id;
    card.innerHTML = `
      <div class="eval-q-num">Q${idx+1} / ${qs.length} — ${escapeHtml(q.section || q.chapter)}</div>
      <div class="eval-q-text">${mdLiteInline(q.question)}</div>
      <div class="eval-hint">Choisis une ou plusieurs réponses — une réponse en trop compte comme fausse.</div>
      <div class="eval-opts">
        ${q.options.map(o => `
          <label class="eval-opt" data-letter="${o.letter}">
            <input type="checkbox" name="q${q.id}" value="${o.letter}">
            <span><strong>${o.letter}.</strong> ${escapeHtml(o.text)}</span>
          </label>
        `).join('')}
      </div>
      <div class="eval-justif" style="display:none;"></div>
    `;
    card.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('change', () => {
        if (evalSubmitted) return;
        if (!evalUserAnswers[q.id]) evalUserAnswers[q.id] = new Set();
        if (inp.checked) evalUserAnswers[q.id].add(inp.value);
        else evalUserAnswers[q.id].delete(inp.value);
      });
    });
    wrap.appendChild(card);
  });
}

function setsEqual(a, b){
  if (a.size !== b.size) return false;
  for (const x of a) if (!b.has(x)) return false;
  return true;
}

function submitEval(){
  const qs = currentEvalQuestions();
  evalSubmitted = true;
  let correctCount = 0;
  const chapterStats = {};

  qs.forEach(q => {
    const card = document.querySelector(`.eval-q-card[data-qid="${q.id}"]`);
    if (!card) return;
    const userSet = evalUserAnswers[q.id] || new Set();
    const correctSet = new Set(q.correct);
    const isCorrect = setsEqual(userSet, correctSet);
    if (isCorrect) correctCount++;

    if (!chapterStats[q.chapter]) chapterStats[q.chapter] = { correct: 0, total: 0 };
    chapterStats[q.chapter].total++;
    if (isCorrect) chapterStats[q.chapter].correct++;

    card.classList.add(isCorrect ? 'correct' : 'incorrect');
    card.querySelectorAll('.eval-opt').forEach(optEl => {
      const letter = optEl.dataset.letter;
      optEl.querySelector('input').disabled = true;
      if (correctSet.has(letter)) optEl.classList.add('opt-correct');
      else if (userSet.has(letter)) optEl.classList.add('opt-wrong');
    });
    if (q.justification){
      const j = card.querySelector('.eval-justif');
      j.style.display = 'block';
      j.innerHTML = `💡 ${escapeHtml(q.justification)}`;
    }
  });

  const pct = qs.length ? Math.round((correctCount / qs.length) * 100) : 0;
  const chapterHtml = Object.entries(chapterStats).map(([ch, s]) =>
    `<span>${escapeHtml(ch.split('—')[0].trim())} : ${s.correct}/${s.total}</span>`
  ).join('');

  $('#evalScoreBanner').innerHTML = `
    <div class="eval-score-banner">
      <div class="eval-score-num">${correctCount} / ${qs.length}</div>
      <div class="eval-score-sub">Score : ${pct}%</div>
      <div class="eval-score-chapters">${chapterHtml}</div>
    </div>
  `;
  $('#evalScoreBanner').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('#evalSubmitBtn').style.display = 'none';
  $('#evalRetryBtn').style.display = 'inline-block';
  $('#evalPdfBtn').style.display = 'inline-block';
}

$('#evalSubmitBtn').addEventListener('click', submitEval);
$('#evalRetryBtn').addEventListener('click', () => {
  evalUserAnswers = {};
  evalSubmitted = false;
  renderEvalQuestions();
});
$('#evalBack').addEventListener('click', renderEvalModuleList);
$('#evalPdfBtn').addEventListener('click', () => downloadEvalPDF());

function downloadEvalPDF(){
  const qs = currentEvalQuestions();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const marginX = 16;
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const maxWidth = pageW - marginX * 2;
  const bottomLimit = pageH - 18;
  let y = 20;

  function ensureSpace(need){ if (y + need > bottomLimit){ doc.addPage(); y = 20; } }

  function wrapText(text, size, bold, indent, color){
    doc.setFont(undefined, bold ? 'bold' : 'normal');
    doc.setFontSize(size);
    doc.setTextColor(...color);
    const wrapped = doc.splitTextToSize(text, maxWidth - indent);
    for (const wl of wrapped){
      ensureSpace(size * 0.42);
      doc.text(wl, marginX + indent, y);
      y += size * 0.42;
    }
  }

  doc.setFont(undefined, 'bold'); doc.setFontSize(15); doc.setTextColor(20,20,25);
  wrapText(evalCurrentQuiz.title, 15, true, 0, [20,20,25]);
  y += 1;
  doc.setDrawColor(200,200,210); doc.line(marginX, y, pageW - marginX, y); y += 6;
  doc.setFontSize(9); doc.setTextColor(120,120,130);
  wrapText(`Module : ${evalCurrentQuiz.module} — ${evalCurrentChapter}${evalCurrentChapter==='Tous' ? '' : ''} — ${qs.length} questions — Généré depuis SaadConcours`, 9, false, 0, [120,120,130]);
  y += 6;

  qs.forEach((q, idx) => {
    ensureSpace(14);
    wrapText(`Q${idx+1}. ${q.question}`, 11, true, 0, [20,20,25]);
    y += 1.5;
    q.options.forEach(o => {
      const isCorrect = q.correct.includes(o.letter);
      ensureSpace(9);
      wrapText(`${o.letter}. ${o.text}`, 9.5, false, 5, isCorrect ? [30,140,90] : [70,70,80]);
    });
    y += 1;
    ensureSpace(9);
    const correctLetters = q.correct.join(', ').toUpperCase();
    wrapText(`Réponse(s) correcte(s) : ${correctLetters}${q.justification ? ' — ' + q.justification : ''}`, 9, true, 0, [30,140,90]);
    y += 5;
  });

  doc.save(`${evalCurrentQuiz.id}_${evalCurrentChapter.replace(/[^a-zA-Z0-9]+/g,'_').slice(0,30)}.pdf`);
}
</script>
