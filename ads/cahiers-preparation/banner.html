<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cahiers de préparation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Bannière du site « Cahiers de préparation, tous les modules » (zones haut
   et bas de page), remplace ads/preparation-s1-s3-s5 (fin des cours de
   soutien). Même charte : indigo nuit uni, teal Licence, surligné jaune,
   appel WhatsApp vert, pas de dégradé hors logo.
   Format par le hash : #desk 970×120, #mob 640×200 (rendus en @2x). */
:root{
  --bg:#1e1b4b; --line:rgba(255,255,255,.05);
  --white:#fff; --soft:#c7d2fe; --teal:#5eead4; --hl:#fde047; --ink:#1e1b4b;
  --wa:#25d366; --wa-dark:#128c4a;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{background:#111;}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif; color:var(--white);}

.ad{
  position:relative; overflow:hidden; background-color:var(--bg);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:20px 20px;
  display:flex; align-items:center;
}
.tag{
  display:inline-block; background:var(--hl); color:var(--ink); font-weight:800; text-transform:uppercase;
  letter-spacing:.06em; border-radius:6px; transform:rotate(-3deg); box-shadow:3px 3px 0 rgba(0,0,0,.3);
}
.big{font-weight:800; letter-spacing:-.03em; line-height:1; white-space:nowrap;}
.big i{font-style:normal; color:var(--teal);}
.fil{font-weight:800; letter-spacing:-.02em; line-height:1.05; white-space:nowrap;}
.fil b{color:var(--hl);}
.sub{font-weight:600; color:var(--soft); white-space:nowrap;}
.cta{display:flex; align-items:center; background:var(--wa); color:#fff; box-shadow:0 4px 0 var(--wa-dark);}
.cta svg{flex-shrink:0;}
.cta small{display:block; font-weight:700; line-height:1.1;}
.cta strong{display:block; font-weight:800; letter-spacing:-.01em; white-space:nowrap; line-height:1.1;}

/* ----- Ordinateur : 970×120 ----- */
.desk{width:970px; height:120px; padding:0 18px 0 26px; gap:22px;}
.desk .left{display:flex; flex-direction:column; align-items:flex-start; gap:9px;}
.desk .tag{font-size:12px; padding:4px 9px;}
.desk .big{font-size:34px;}
.desk .mid{flex:1; min-width:0; border-left:2px solid rgba(255,255,255,.14); padding-left:22px;}
.desk .fil{font-size:27px;}
.desk .sub{font-size:14px; margin-top:6px;}
.desk .cta{gap:12px; padding:12px 20px 12px 14px; border-radius:16px;}
.desk .cta svg{width:42px; height:42px;}
.desk .cta small{font-size:13px;}
.desk .cta strong{font-size:25px; margin-top:2px;}

/* ----- Mobile : 640×200 ----- */
.mob{width:640px; height:200px; padding:20px 24px; flex-direction:column; align-items:stretch; justify-content:space-between;}
.mob .row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.mob .tag{font-size:17px; padding:5px 11px;}
.mob .big{font-size:44px;}
.mob .fil{font-size:27px;}
.mob .cta{gap:14px; padding:10px 18px; border-radius:16px; justify-content:center;}
.mob .cta svg{width:40px; height:40px;}
.mob .cta small{font-size:16px;}
.mob .cta strong{font-size:31px;}
.mob .cta .txt{display:flex; align-items:baseline; gap:12px;}
</style>
</head>
<body>
<!-- Ordinateur -->
<div class="ad desk" id="desk">
  <div class="left">
    <span class="tag">Cahiers de préparation</span>
    <span class="big">Tous les modules</span>
  </div>
  <div class="mid">
    <p class="fil">Le cahier de <b>ton module</b></p>
    <p class="sub">Bac · Licence FSJES · Master</p>
  </div>
  <div class="cta">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.7-1.2-4.5-3.9-4.6-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.3c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.6.7 1.9.8 2 .1.2.1.4 0 .6-.1.2-.2.4-.3.5-.2.2-.3.4-.1.7.2.3.9 1.4 1.9 2.3 1.3 1.2 2.4 1.5 2.7 1.7.3.2.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.3.7-.2.3.1 1.8.8 2.1.9.3.2.5.2.6.4.1.2.1.9-.1 1.5Z"/></svg>
    <div>
      <small>Commande sur WhatsApp</small>
      <strong>+212 7 13 87 53 27</strong>
    </div>
  </div>
</div>

<!-- Mobile -->
<div class="ad mob" id="mob">
  <div class="row">
    <span class="big">Tous les modules</span>
    <span class="tag">Cahiers</span>
  </div>
  <p class="fil">Cahiers de préparation <b>à acheter</b></p>
  <div class="cta">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.7-1.2-4.5-3.9-4.6-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 .9-2.3c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.6.7 1.9.8 2 .1.2.1.4 0 .6-.1.2-.2.4-.3.5-.2.2-.3.4-.1.7.2.3.9 1.4 1.9 2.3 1.3 1.2 2.4 1.5 2.7 1.7.3.2.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.3.7-.2.3.1 1.8.8 2.1.9.3.2.5.2.6.4.1.2.1.9-.1 1.5Z"/></svg>
    <div class="txt">
      <small>WhatsApp</small>
      <strong>+212 7 13 87 53 27</strong>
    </div>
  </div>
</div>
<script>
  var f = (location.hash || "#desk").slice(1);
  document.getElementById(f === "mob" ? "desk" : "mob").style.display = "none";
</script>
</body>
</html>
