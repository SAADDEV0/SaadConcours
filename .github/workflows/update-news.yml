name: Mise à jour des concours ouverts (almaster)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Récupérer les nouveautés almaster
        run: python3 scripts/fetch_almaster.py

      - name: Committer si public/data/news.json a changé
        run: |
          if git diff --quiet -- public/data/news.json; then
            echo "Aucun changement, rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          git commit -m "Mise à jour automatique des concours ouverts (almaster)"
          git push
