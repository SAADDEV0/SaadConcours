name: Mise à jour des concours ouverts (almaster)

# Plus de déclenchement planifié depuis le 04/10/2026 : la section « Concours
# ouverts » a quitté le site public le 24/09/2026 et le scraper est coupé
# (newsScraperEnabled: false). Le cron tournait quand même tous les deux jours
# pour s'arrêter à l'étape « gate » — des minutes Actions pour rien.
# Lancement à la main depuis l'onglet Actions si besoin.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Vérifier si le scraping est activé (réglage admin)
        id: gate
        run: |
          enabled=$(curl -fsSL https://saadconcours.space/api/settings | jq -r '.newsScraperEnabled // true' 2>/dev/null || echo true)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "Scraping désactivé depuis l'admin (Réglages), on s'arrête ici."
          fi

      - name: Récupérer les nouveautés almaster
        if: steps.gate.outputs.enabled != 'false'
        run: python3 scripts/fetch_almaster.py

      - name: Committer si public/data/news.json a changé
        if: steps.gate.outputs.enabled != 'false'
        run: |
          if git diff --quiet -- public/data/news.json; then
            echo "Aucun changement, rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          git commit -m "Mise à jour automatique des concours ouverts (almaster)"
          git push

      - name: Ouvrir une issue si le job a échoué
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label scraper-failure --state open --json number --jq '.[0].number')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Le scraper almaster a échoué" \
              --label scraper-failure \
              --body "Le workflow \"Mise à jour des concours ouverts (almaster)\" a échoué. Logs : $run_url"
          fi

      - name: Fermer l'issue de suivi si le job a réussi
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label scraper-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Le scraper a de nouveau tourné avec succès."
          fi
