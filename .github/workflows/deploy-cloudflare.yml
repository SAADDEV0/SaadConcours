# Deploys the site to Cloudflare Workers on every push to main.
#
# WHY A BUILD-TIME GITHUB TOKEN IS REQUIRED
#   Pages are prerendered at build time, and lib/store.js reads settings.json
#   through GitHub's authenticated Contents API to do it. Without a valid
#   token the build still succeeds, but it bakes pages with no settings — no
#   analytics tag, and the news établissement whitelist silently unapplied.
#   The secret cannot be called GITHUB_TOKEN (GitHub reserves that prefix for
#   the automatic Actions token), so it is passed in under a different name
#   and mapped to the variable the code expects.
#
# SECRETS TO ADD  (repo Settings > Secrets and variables > Actions)
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard > My Profile > API Tokens >
#                          Create Token > "Edit Cloudflare Workers" template
#   GH_CONTENT_TOKEN       the same ghp_ token already set as a Worker secret
#
# The Cloudflare account id is not a secret and lives in wrangler.jsonc.
#
# NOTE ON COST
#   populateCache writes into Workers static assets, not KV, so running this
#   on every push costs nothing in quota. See open-next.config.ts.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  # Lets you trigger a deploy by hand from the Actions tab, which is useful
  # for re-baking pages after changing settings in the admin without also
  # having to make a code commit.
  workflow_dispatch:

# A push that lands while a deploy is running cancels it rather than racing:
# two concurrent deploys of the same Worker would upload conflicting bundles.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 22 and not 20: wrangler 4 refuses to run on anything below Node 22
      # ("Wrangler requires at least Node.js v22.0.0"). The build and cache
      # steps are happy on 20, so only the final deploy fails — which makes
      # this look like a credentials problem when it is a runtime one.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
        run: npx opennextjs-cloudflare build

      # Sort les pages publiques du chemin du Worker. Sans cette étape,
      # OpenNext les sert depuis le cache incrémental, donc via le Worker,
      # donc avec 10 ms de CPU pour un démarrage à froid qui en coûte 33 :
      # 18 % des pages publiques rendaient une Error 1102. Voir l'en-tête de
      # scripts/prerender-to-assets.mjs.
      - name: Publish prerendered pages as static assets
        run: node scripts/prerender-to-assets.mjs

      - name: Populate static asset cache
        env:
          GITHUB_TOKEN: ${{ secrets.GH_CONTENT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare populateCache remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Fails the build early rather than deploying pages that look fine and
      # are quietly wrong. Without a valid GH_CONTENT_TOKEN the build still
      # succeeds, but settings.json cannot be read, so pages bake with no
      # analytics tag and no établissement whitelist. Every such page still
      # returns 200, so a status-code check alone would wave it through --
      # which is exactly how this went unnoticed during the migration.
      - name: Check the build baked real settings
        run: |
          set -e
          # /news n'existe plus depuis le 2026-09-24 : n'importe quelle page
          # prérendue porte le tag, /faq est la plus stable.
          page=$(find .next/server/app -maxdepth 1 -name "faq.html" | head -1)
          [ -n "$page" ] || { echo "faq.html not found in build output"; exit 1; }
          if ! grep -q "googletagmanager" "$page"; then
            echo "FAILED: no analytics tag in the prerendered HTML."
            echo "That means settings.json was unreadable at build time --"
            echo "check that GH_CONTENT_TOKEN is set and still valid."
            exit 1
          fi
          echo "  settings loaded at build time: analytics tag present"

      - name: Verify the deployed site responds
        run: |
          set -e
          sleep 10
          for path in "" "concours" "a-propos" "sitemap.xml"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              "https://www.saadconcours.space/$path")
            echo "  /$path -> $code"
            [ "$code" = "200" ] || { echo "FAILED: /$path returned $code"; exit 1; }
          done
          # The sitemap collapses to 8 static routes when the data fetch fails.
          # Since 2026-09-26 it is published as a static asset from the build
          # (scripts/prerender-to-assets.mjs refuses a truncated one), so its
          # size here proves the deployed file is the full one.
          urls=$(curl -s --max-time 60 "https://www.saadconcours.space/sitemap.xml" | grep -c "<loc>")
          echo "  sitemap urls -> $urls"
          [ "$urls" -gt 50 ] || { echo "FAILED: sitemap has only $urls urls"; exit 1; }

      # LE GARDE-FOU QUI EMPÊCHE L'ERROR 1102 DE REVENIR
      #
      # Sur le plan gratuit, une invocation dispose de 10 ms de CPU et le seul
      # démarrage de l'isolate en consomme 33 : toute page servie PAR LE WORKER
      # rend une 1102 dès qu'elle tombe à froid. L'invariant du site public est
      # donc « aucune invocation », et il se vérifie à un seul endroit : la
      # réponse ne doit pas porter l'en-tête x-opennext, que seul le Worker
      # pose.
      #
      # Ce test échoue si quelqu'un rend une page publique dynamique — cookies,
      # headers(), searchParams, revalidate, force-dynamic — ou si l'étape de
      # publication en assets casse. C'est volontairement un échec de
      # déploiement et non un avertissement : la panne qu'il prévient est
      # invisible en local (le Worker local n'a pas de limite CPU) et ne se
      # manifeste en production que sur une fraction des requêtes, ce qui la
      # rend très facile à ne pas voir.
      #
      # Les tentatives répétées ne sont pas de la complaisance : la mise à
      # disposition des assets n'est pas instantanée sur tout le réseau après
      # un déploiement, et concours.html pèse 3,6 Mo — c'est le plus gros, donc
      # le dernier arrivé. Sans ce délai, l'étape échouait alors que le site
      # était correct, et un garde-fou qui crie au loup à chaque déploiement
      # finit désactivé. La règle reste stricte : au bout des essais, une page
      # encore servie par le Worker fait échouer le déploiement.
      - name: Public pages must not invoke the Worker
        run: |
          set -e
          fail=0
          for path in "" "concours" "cours" "bac/2bac" "blog" "faq" "evaluation" "a-propos" "sitemap.xml"; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              hdr=$(curl -s -o /dev/null -D - --max-time 60 \
                "https://www.saadconcours.space/$path" | tr -d '\r' \
                | grep -i '^x-opennext:' || true)
              if [ -z "$hdr" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = "0" ]; then
              echo "  /$path -> SERVI PAR LE WORKER apres 6 essais ($hdr)"
              fail=1
            else
              echo "  /$path -> asset statique, aucune invocation (essai $attempt)"
            fi
          done
          if [ "$fail" = "1" ]; then
            echo ""
            echo "FAILED: au moins une page publique repasse par le Worker."
            echo "Elle rendra une Error 1102 sur chaque isolate froid."
            echo "Cause probable : la page est devenue dynamique (cookies(),"
            echo "headers(), searchParams, revalidate, force-dynamic), donc"
            echo "next build ne l'a plus prérendue en .html et"
            echo "scripts/prerender-to-assets.mjs n'avait rien à publier."
            exit 1
          fi
